*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20;color:var(--brown);}
#hud-top{position:absolute;top:calc(8px + var(--safe-top));left:calc(10px + var(--safe-left));right:calc(10px + var(--safe-right));
  display:flex;align-items:flex-start;justify-content:space-between;gap:8px;}

#quest-label{font-size:11px;font-weight:900;letter-spacing:.12em;color:var(--accent);text-transform:uppercase;}
#quest-text{font-size:14px;font-weight:700;line-height:1.25;margin-top:2px;}
#hud-stats{display:flex;flex-direction:column;gap:6px;align-items:flex-end;}
.stat{background:rgba(255,246,232,.92);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:900;
  box-shadow:0 3px 10px rgba(60,35,10,.15);white-space:nowrap;}

#watch-ind{position:absolute;top:calc(70px + var(--safe-top));left:50%;transform:translateX(-50%);
  padding:6px 16px;border-radius:999px;font-weight:900;font-size:14px;box-shadow:0 4px 12px rgba(0,0,0,.2);}
#watch-ind.warn{background:rgba(255,107,94,.95);color:#fff;}
#watch-ind.ok{background:rgba(127,201,107,.95);color:#243d1c;}
#prompt{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(148px + var(--safe-bottom));
  background:rgba(74,53,36,.88);color:#ffe9c8;padding:7px 16px;border-radius:999px;font-weight:700;font-size:14px;
  white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25);}

  font-size:17px;font-weight:900;text-align:center;color:var(--brown);opacity:0;transition:opacity .35s ease;

.pug-emoji{font-size:56px;line-height:1;margin-bottom:6px;}
.row{display:flex;gap:10px;}
.row .btn{flex:1;}
.ctrl-grid{display:flex;gap:14px;text-align:left;flex-wrap:wrap;justify-content:center;}
.ctrl-col{flex:1;min-width:220px;background:#fbf0dc;border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.9;}
.ctrl-col b{color:var(--accent);}
kbd{background:#4a3524;color:#ffe9c8;border-radius:6px;padding:1px 7px;font-weight:900;font-size:12px;font-family:'Nunito';}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#fbf0dc;
  border-radius:14px;padding:11px 14px;margin:8px 0;font-weight:700;font-size:15px;}
.seg{display:flex;gap:6px;}
.seg button{padding:7px 12px;border-radius:10px;background:#e6d3b3;font-weight:900;color:var(--brown2);font-size:13px;}
.seg button.on{background:var(--accent);color:#fff;}
input[type=range]{width:130px;accent-color:var(--accent);}
.switch{position:relative;width:52px;height:30px;background:#d8c3a0;border-radius:99px;transition:background .2s;flex:none;}
.switch.on{background:var(--ok);}
.switch::after{content:'';position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.25);}
.switch.on::after{left:25px;}
.ach-item{display:flex;gap:12px;align-items:center;background:#fbf0dc;border-radius:14px;padding:11px 14px;margin:8px 0;text-align:left;}
.ach-item .ico{font-size:28px;width:40px;text-align:center;flex:none;}
.ach-item .t{font-weight:900;font-size:15px;}
.ach-item .d{font-size:12.5px;color:var(--brown2);}
.ach-item.locked{opacity:.45;filter:grayscale(.7);}
.stat-line{display:flex;justify-content:space-between;background:#fbf0dc;border-radius:12px;padding:9px 16px;margin:6px 0;font-weight:700;font-size:15px;}
.stat-line span:last-child{font-weight:900;color:var(--accent);}
.title-big{font-size:clamp(24px,5.4vw,40px);font-weight:900;color:#c96f1e;letter-spacing:.03em;margin:4px 0;}
.crown{font-size:15px;font-weight:900;color:#a67908;background:linear-gradient(180deg,#ffe9a8,#ffd166);
  border-radius:999px;padding:7px 18px;display:inline-block;margin:8px 0;box-shadow:0 3px 0 #d9ab3c;}

/* ---------- Telegram safe-area: экраны, панели, сообщения ---------- */
.screen{
  padding:
    calc(16px + var(--safe-top))
    calc(16px + var(--safe-right))
    calc(16px + var(--safe-bottom))
    calc(16px + var(--safe-left));
}
.panel {
  max-height: calc(
    var(--tg-viewport-stable-height, 100dvh)
    - var(--safe-top)
    - var(--safe-bottom)
    - 32px
  );
}
#bubble { bottom: calc(186px + var(--safe-bottom)); }
#hold-wrap { bottom: calc(242px + var(--safe-bottom)); }

/* ---------- Портрет Матвея ---------- */
.portrait-wrap{width:128px;height:128px;border-radius:50%;margin:0 auto 10px;overflow:hidden;
  border:5px solid var(--accent2);background:#f7e7cd;box-shadow:0 8px 22px rgba(120,60,10,.35);}
.portrait-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.portrait-wrap svg{width:100%;height:100%;display:block;}
@media (max-width:420px){ .portrait-wrap{width:104px;height:104px;} }

/* ---------- QA-панель ---------- */
#debug-panel{position:fixed;right:calc(8px + var(--safe-right));top:calc(110px + var(--safe-top));
  z-index:95;background:rgba(30,20,10,.88);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:5px;
  max-width:230px;max-height:70vh;overflow-y:auto;}
#debug-panel button{background:#5c4430;color:#ffe9c8;border-radius:8px;padding:6px 8px;font-size:11.5px;font-weight:700;text-align:left;}
#debug-panel .dbg-head{color:#ffd166;font-weight:900;font-size:12px;display:flex;justify-content:space-between;align-items:center;gap:8px;}
#debug-panel .dbg-head button{width:26px;padding:2px;text-align:center;flex:none;}
#dbg-tg-info{color:#bfe6a8;font-size:10.5px;line-height:1.5;white-space:pre-wrap;background:rgba(0,0,0,.3);border-radius:8px;padding:6px;}

/* ---------- Toast / intro / misc ---------- */
#ach-toast{position:fixed;top:calc(14px + var(--safe-top));right:calc(12px + var(--safe-right));z-index:90;
  background:linear-gradient(135deg,#ffe9a8,#ffd166);color:#5c430a;border-radius:18px;padding:12px 18px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);transform:translateX(130%);transition:transform .45s cubic-bezier(.2,1.4,.4,1);max-width:290px;}
#ach-toast.show{transform:translateX(0);}
#ach-toast .t{font-weight:900;font-size:15px;}
#ach-toast .d{font-size:12.5px;font-weight:700;}
#intro-overlay{position:fixed;inset:0;z-index:55;display:flex;align-items:center;justify-content:center;pointer-events:none;
  background:rgba(20,12,4,.65);transition:opacity .6s;}
#intro-text{color:#ffefd6;font-size:clamp(22px,5vw,38px);font-weight:900;text-align:center;padding:0 20px;
  text-shadow:0 4px 20px rgba(0,0,0,.6);opacity:0;transition:opacity .6s;}
#portrait-warning{position:fixed;inset:0;z-index:200;background:#2a1c0d;color:#ffefd6;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:20px;gap:16px;}
#portrait-warning .rot{font-size:52px;animation:rot 2s ease-in-out infinite;}
@keyframes rot{0%,100%{transform:rotate(0)}50%{transform:rotate(90deg)}}
#error-screen{position:fixed;inset:0;z-index:300;background:#241505;color:#ffefd6;display:flex;align-items:center;justify-content:center;text-align:center;}
#error-screen .panel{background:#33200e;color:#ffefd6;box-shadow:none;}
#error-screen .desc{color:#e8cfa8;}

    calc(30px + var(--safe-right))
    calc(30px + var(--safe-bottom))

}

    calc(26px + var(--safe-right))
    calc(26px + var(--safe-bottom))
    calc(26px + var(--safe-left));

#fade{position:fixed;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2.2s ease;z-index:50;}

============================================================ */
var AudioSys={
  ctx:null, master:null, noiseBuf:null, hum:null,
  unlocked:false, failed:false,
  buffers:{}, raw:{}, lastPlay:{},
  ensure:function(){
    var self=this;
    return new Promise(function(resolve){
      try{
        if(self.ctx){
          if(self.ctx.state==='running'){ self.unlocked=true; self.failed=false; self.decodePending(); resolve(true); return; }
          self.ctx.resume().then(function(){
            var ok=self.ctx.state==='running';
            self.unlocked=ok; self.failed=!ok;
            if(ok) self.decodePending();
            self.playSilent();
            resolve(ok);
          }).catch(function(){ self.failed=true; resolve(false); });
          return;
        }
        var AC=window.AudioContext||window.webkitAudioContext;
        if(!AC){ self.failed=true; resolve(false); return; }
        self.ctx=new AC();
        self.master=self.ctx.createGain();
        self.master.gain.value=settings.sound?0.75:0;
        self.master.connect(self.ctx.destination);
        var len=self.ctx.sampleRate;
        self.noiseBuf=self.ctx.createBuffer(1,len,self.ctx.sampleRate);
        var d=self.noiseBuf.getChannelData(0);
        for(var i=0;i&lt;len;i++) d[i]=Math.random()*2-1;
        self.playSilent();
        var finish=function(){
          var ok=self.ctx.state==='running';
          if(!ok&amp;&amp;self.ctx.resume){
            self.ctx.resume().then(function(){
              self.unlocked=self.ctx.state==='running'; self.failed=!self.unlocked;
              if(self.unlocked) self.decodePending();
              resolve(self.unlocked);
            }).catch(function(){ self.failed=true; resolve(false); });
          } else {
            self.unlocked=ok; self.failed=!ok;
            if(ok) self.decodePending();
            resolve(ok);
          }
        };
        if(self.ctx.state==='suspended'){ self.ctx.resume().then(finish).catch(function(){ self.failed=true; resolve(false); }); }
        else finish();
      }catch(e){ console.error('AudioSys.ensure:',e); self.failed=true; resolve(false); }
    });
  },
  playSilent:function(){
    try{
      var b=this.ctx.createBuffer(1,1,this.ctx.sampleRate);
      var s=this.ctx.createBufferSource(); s.buffer=b; s.connect(this.master); s.start(0);
    }catch(e){}
  },
  resume:function(){
    var self=this;
    return new Promise(function(resolve){
      if(!self.ctx){ resolve(false); return; }
      if(self.ctx.state==='running'){ self.unlocked=true; self.failed=false; resolve(true); return; }
      self.ctx.resume().then(function(){
        self.unlocked=self.ctx.state==='running'; self.failed=!self.unlocked;
        if(self.unlocked) self.decodePending();
        resolve(self.unlocked);
      }).catch(function(){ self.failed=true; resolve(false); });
    });
  },
  suspend:function(){ if(this.ctx&amp;&amp;this.ctx.state==='running'){ try{ this.ctx.suspend(); }catch(e){} } },
  decodePending:function(){
    var self=this;
    Object.keys(this.raw).forEach(function(n){
      if(self.buffers[n]||!self.raw[n]) return;
      var ab=self.raw[n]; self.raw[n]=null;
      try{ self.ctx.decodeAudioData(ab, function(buf){ self.buffers[n]=buf; }, function(){}); }catch(e){}
    });
  },
  playNamed:function(name,vol){
    if(!this.ctx||!this.buffers[name]) return false;
    var now=this.ctx.currentTime;
    if(this.lastPlay[name]&amp;&amp;now-this.lastPlay[name]&lt;0.06) return true;
    this.lastPlay[name]=now;
    try{
      var s=this.ctx.createBufferSource(); s.buffer=this.buffers[name];
      var g=this.ctx.createGain(); g.gain.value=Math.min(vol,0.8);
      s.connect(g); g.connect(this.master); s.start(0);
    }catch(e){}
    return true;
  },
  setSound:function(on){
    settings.sound=on; saveSettings();
    if(this.master) this.master.gain.value=on?0.75:0;
    if(!on) this.stopHum();
    else if(this.ctx&amp;&amp;this.ctx.state==='suspended') this.resume();
  },
  startSound:function(){ this.tone(520,784,0.16,'triangle',0.3); },
  tone:function(f0,f1,dur,type,vol,delay){
    if(!this.ctx) return; delay=delay||0;
    var t=this.ctx.currentTime+delay, o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type=type||'sine'; o.frequency.setValueAtTime(Math.max(f0,1),t);
    o.frequency.exponentialRampToValueAtTime(Math.max(f1,1),t+dur);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(vol,0.001),t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t+dur+0.06);
  },
  noise:function(dur,vol,f0,f1,delay,type){
    if(!this.ctx) return; delay=delay||0;
    var t=this.ctx.currentTime+delay, src=this.ctx.createBufferSource();
    src.buffer=this.noiseBuf; src.loop=true;
    var flt=this.ctx.createBiquadFilter(); flt.type=type||'bandpass';
    flt.frequency.setValueAtTime(Math.max(f0,10),t);
    flt.frequency.exponentialRampToValueAtTime(Math.max(f1,10),t+dur); flt.Q.value=1.2;
    var g=this.ctx.createGain(); g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(Math.max(vol,0.001),t+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    src.connect(flt); flt.connect(g); g.connect(this.master);
    src.start(t); src.stop(t+dur+0.05);
  },
  collect:function(){ this.tone(520,780,0.14,'triangle',0.3); this.tone(1560,1900,0.1,'sine',0.09,0.05); },
  achieve:function(){ var f=[523,659,784,1047]; for(var i=0;i&lt;f.length;i++) this.tone(f[i],f[i],0.2,'triangle',0.22,i*0.11); },
  door:function(){ this.tone(130,78,0.6,'sawtooth',0.14); this.noise(0.28,0.1,250,900,0.42); },
  quest:function(){ this.tone(587,587,0.14,'triangle',0.26); this.tone(880,880,0.24,'triangle',0.26,0.13); },
  step:function(run){
    if(this.playNamed('steps',0.35)) return;
    this.noise(0.055,run?0.1:0.06,120,420,0,'lowpass');
    this.tone(95,60,0.05,'sine',run?0.08:0.05);
  },
  whine:function(){
    if(this.playNamed('whine',0.5)) return;
    this.tone(760,470,0.42,'sine',0.2); this.tone(720,450,0.36,'sine',0.09,0.1);
  },
  snort:function(){
    if(this.playNamed('snort',0.5)) return;
    this.tone(150,95,0.14,'square',0.14); this.noise(0.12,0.12,240,650);
  },
  jump:function(){ this.noise(0.22,0.16,300,1400); },
  dig:function(){
    if(this.playNamed('dig',0.5)) return;
    for(var i=0;i&lt;6;i++){ this.noise(0.06,0.12,220,950,i*0.085,'lowpass'); this.tone(110,70,0.05,'sine',0.06,i*0.085); }
  },
  pickup:function(){ this.tone(380,640,0.15,'triangle',0.22); },
  fail:function(){ this.tone(210,140,0.22,'sine',0.16); },
  treat:function(){ this.tone(500,900,0.1,'sine',0.2); this.noise(0.08,0.08,300,800,0.1,'lowpass'); this.tone(300,180,0.14,'sine',0.14,0.16); },
  snore:function(){
    if(this.playNamed('snore',0.55)) return;
    if(!this.ctx) return;
    var t=this.ctx.currentTime;
    var o=this.ctx.createOscillator(); o.type='sawtooth';
    o.frequency.setValueAtTime(52,t); o.frequency.exponentialRampToValueAtTime(36,t+0.85);
    var o2=this.ctx.createOscillator(); o2.type='sawtooth';
    o2.frequency.setValueAtTime(55,t); o2.frequency.exponentialRampToValueAtTime(38,t+0.85);
    var flt=this.ctx.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=240;
    var g=this.ctx.createGain();
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.15,t+0.12);
    g.gain.setValueAtTime(0.15,t+0.55);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.95);
    o.connect(flt); o2.connect(flt); flt.connect(g); g.connect(this.master);
    o.start(t); o2.start(t); o.stop(t+1); o2.stop(t+1);
    this.noise(0.3,0.03,400,700,1.0,'bandpass');
  },
  startHum:function(){
    if(!this.ctx||this.hum) return;
    var o=this.ctx.createOscillator(), g=this.ctx.createGain();
    o.type='triangle'; o.frequency.value=58; g.gain.value=0;
    o.connect(g); g.connect(this.master); o.start();
    g.gain.linearRampToValueAtTime(0.05,this.ctx.currentTime+0.6);
    this.hum={o:o,g:g};
  },
  stopHum:function(){
    if(this.hum){ try{ this.hum.g.gain.linearRampToValueAtTime(0.0001,this.ctx.currentTime+0.3); this.hum.o.stop(this.ctx.currentTime+0.4);}catch(e){} this.hum=null; }
  }
};

function box(w,h,d,mat,x,y,z,parent,shadow){
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);

function makeDoor(hingeX,hingeZ,axisX,dirSign,width){
  var grp=new THREE.Group(); grp.position.set(hingeX,0,hingeZ); scene.add(grp);
  var mesh;
  if(axisX==='x'){ mesh=box(width,2.15,0.12,M.wood,width/2,1.075,0,grp); }
  else{ mesh=box(0.12,2.15,width,M.wood,0,1.075,width/2,grp); }
  mesh.castShadow=true;
  box(0.08,0.3,0.08,M.metal,axisX==='x'?width-0.18:dirSign*0.1,1.0,axisX==='x'?dirSign*0.1:width-0.18,grp);
  var casing=new THREE.Group(); casing.position.set(hingeX,0,hingeZ); scene.add(casing);
  if(axisX==='x'){
    box(width+0.34,0.14,0.34,M.white,width/2,2.22,0,casing);
    box(0.14,2.3,0.34,M.white,-0.1,1.15,0,casing);
    box(0.14,2.3,0.34,M.white,width+0.1,1.15,0,casing);
  }else{
    box(0.34,0.14,width+0.34,M.white,0,2.22,width/2,casing);
    box(0.34,2.3,0.14,M.white,0,1.15,-0.1,casing);
    box(0.34,2.3,0.14,M.white,0,1.15,width+0.1,casing);
  }
  return grp;
}

function glbKeyFor(st){
  if(st==='walk') return pug.moveAmt&gt;0.7?'run':'walk';
  if(st==='idle') return 'idle';
  if(st==='sit'||st==='beg') return 'sit';
  if(st==='sniff') return 'sniff';
  if(st==='dig'||st==='scratch') return 'dig';
  if(st==='sleep'||st==='lie') return 'sleep';
  if(st==='spin') return 'walk';
  return 'idle';
}
function updateGlb(dt){
  if(!glb.active||!glb.mixer) return;
  var key=glbKeyFor(pug.state);
  var act=glb.actions[key]||glb.actions['idle']||null;
  if(act&amp;&amp;glb.current!==act){
    if(glb.current) glb.current.fadeOut(0.25);
    act.reset().fadeIn(0.25).play();
    glb.current=act;
  }
  glb.mixer.update(dt);
}
function tryLoadGlb(){
  if(typeof THREE.GLTFLoader==='undefined') return;
  try{
    new THREE.GLTFLoader().load('assets/matvey.glb', function(gltf){
      var obj=gltf.scene;
      var bb=new THREE.Box3().setFromObject(obj);
      var size=new THREE.Vector3(); bb.getSize(size);
      var h=size.y||1, s=0.52/h;
      obj.scale.set(s,s,s);
      var bb2=new THREE.Box3().setFromObject(obj);
      obj.position.y-=bb2.min.y;
      obj.rotation.y=GLB_ROT_Y;
      obj.traverse(function(m){ if(m.isMesh) m.castShadow=true; });
      pugRoot.add(obj);
      pugBody.visible=false;
      glb.active=true; glb.model=obj;
      if(gltf.animations&amp;&amp;gltf.animations.length){
        glb.mixer=new THREE.AnimationMixer(obj);
        gltf.animations.forEach(function(clip){
          var n=(clip.name||'').toLowerCase(), key=null;
          if(n.indexOf('idle')&gt;=0||n.indexOf('stand')&gt;=0) key='idle';
          else if(n.indexOf('run')&gt;=0) key='run';
          else if(n.indexOf('walk')&gt;=0) key='walk';
          else if(n.indexOf('sit')&gt;=0) key='sit';
          else if(n.indexOf('sniff')&gt;=0) key='sniff';
          else if(n.indexOf('dig')&gt;=0) key='dig';
          else if(n.indexOf('sleep')&gt;=0||n.indexOf('lie')&gt;=0) key='sleep';
          if(key&amp;&amp;!glb.actions[key]) glb.actions[key]=glb.mixer.clipAction(clip);
        });
      }
      /* поводок должен корректно отображаться и с GLB-моделью */
      setCarriedLeashVisible(G.hasLeash);
    }, undefined, function(){ /* модели нет — тихо остаёмся на процедурной */ });
  }catch(e){}
}

function animatePug(dt){
  if(glb.active){ updateGlb(dt); return; }
  pug.t+=dt;
  var b=pugBody, t=pug.t;
  b.position.set(0,0,0); b.rotation.set(0,0,0); b.scale.set(1,1,1);
  P.headGrp.rotation.set(0,0,0); P.headGrp.position.set(0,0.52,0.33);
  [P.legFL,P.legFR,P.legRL,P.legRR].forEach(function(l){ l.rotation.set(0,0,0); l.scale.y=1; });
  P.tongue.visible=false; P.tongue.scale.set(0.032,0.012,0.05);
  P.nose.scale.set(0.036,0.03,0.028); P.chin.position.y=-0.108;
  P.eyes[0].position.set(-0.086,0.02,0.108); P.eyes[1].position.set(0.086,0.02,0.108);
  var earB=0;
  var eyeS=1;
  pug.blinkT-=dt; if(pug.blinkT&lt;=0){ pug.blink=0.13; pug.blinkT=rand(2.5,5.5); }
  if(pug.blink&gt;0){ pug.blink-=dt; eyeS=0.12; }

  var st=pug.state, ph=pug.walkPhase;
  var runK=clamp((pug.moveAmt-0.6)/0.4,0,1);
  var wag=0.5+pug.moveAmt*1.5+(st==='beg'?1.5:0);

  if(st==='idle'||st==='walk'){
    var amp=st==='walk'?clamp(pug.moveAmt,0.2,1):0;
    var lA=st==='walk'?lerp(0.5,0.7,runK)*amp:0;
    P.legFL.rotation.x=Math.sin(ph)*lA; P.legRR.rotation.x=Math.sin(ph)*lA;
    P.legFR.rotation.x=Math.sin(ph+Math.PI)*lA; P.legRL.rotation.x=Math.sin(ph+Math.PI)*lA;
    b.position.y=Math.abs(Math.sin(ph))*0.022*amp;
    b.rotation.z=Math.sin(ph)*lerp(0.07,0.12,runK)*amp;
    b.rotation.x=Math.sin(ph*2)*0.025*amp;
    earB=Math.abs(Math.sin(ph))*0.12*(0.4+runK);
    var br=1+Math.sin(t*lerp(2.1,3.4,runK))*0.02; b.scale.set(1,br,br);
    pug.headTurnT-=dt;
    if(pug.headTurnT&lt;=0){ pug.headYawT=rand(-0.6,0.6); pug.headTurnT=rand(2.5,6); }
    pug.headYaw=lerp(pug.headYaw,pug.headYawT,dt*3);
    P.headGrp.rotation.y=pug.headYaw;
    P.headGrp.position.y=0.52+Math.sin(ph*2)*0.008*amp;
    P.headGrp.rotation.x=Math.sin(ph)*0.04*amp;
    pug.lickT-=dt;
    if(pug.lickT&lt;=0){ pug.lick=0.9; pug.lickT=999; }
    if(pug.lick&gt;0){
      pug.lick-=dt; P.tongue.visible=true;
      P.tongue.scale.set(0.032,0.012+Math.abs(Math.sin(t*16))*0.02,0.05);
      P.tongue.position.y=-0.10;
      if(pug.lick&lt;=0) P.tongue.visible=false;
    }
  }
  else if(st==='sit'||st==='beg'){
    b.rotation.x=-0.38; b.position.y=0.05; b.position.z=-0.03;
    P.legRL.scale.y=0.42; P.legRR.scale.y=0.42;
    P.legRL.rotation.x=-0.85; P.legRR.rotation.x=-0.85;
    P.legFL.scale.y=1.5; P.legFR.scale.y=1.5;
    P.legFL.rotation.z=0.06; P.legFR.rotation.z=-0.06;
    P.headGrp.rotation.x=0.34;
    P.eyes[0].position.y=0.026; P.eyes[1].position.y=0.026;
    if(st==='beg'){
      P.headGrp.rotation.x=-0.12;
      P.headGrp.rotation.z=Math.sin(t*1.5)*0.08;
      P.legFR.rotation.x=-1.25+Math.sin(t*7)*0.06;
      P.eyes[0].position.y=0.03; P.eyes[1].position.y=0.03;
      wag=2.5;
    }
    var br2=1+Math.sin(t*2.6)*0.02; b.scale.set(1,br2,br2);
  }
  else if(st==='sniff'){
    b.position.y=-0.04;
    P.headGrp.rotation.x=0.62; P.headGrp.position.y=0.46; P.headGrp.position.z=0.36;
    var tw2=1+Math.sin(t*22)*0.15;
    P.nose.scale.set(0.036*tw2,0.03*tw2,0.028*tw2);
    P.legFL.rotation.x=0.15; P.legFR.rotation.x=0.15;
    var br3=1+Math.sin(t*7)*0.02; b.scale.set(1,br3,br3);
  }
  else if(st==='dig'){
    b.position.y=-0.05; b.position.z=-0.04+Math.sin(t*6)*0.012;
    b.rotation.x=0.12;
    P.headGrp.rotation.x=0.5; P.headGrp.position.y=0.46;
    P.legFL.rotation.x=-0.35+Math.sin(t*16)*0.85;
    P.legFR.rotation.x=-0.35+Math.sin(t*16+Math.PI)*0.85;
    P.legRL.rotation.x=-0.1; P.legRR.rotation.x=-0.1;
  }
  else if(st==='spin'){
    var amp2=0.55;
    P.legFL.rotation.x=Math.sin(t*9)*amp2; P.legRR.rotation.x=Math.sin(t*9)*amp2;
    P.legFR.rotation.x=Math.sin(t*9+Math.PI)*amp2; P.legRL.rotation.x=Math.sin(t*9+Math.PI)*amp2;
    b.position.y=Math.abs(Math.sin(t*9))*0.02;
  }
  else if(st==='scratch'){
    b.rotation.x=0.15;
    P.headGrp.rotation.x=-0.3;
    P.legFL.rotation.x=-0.5+Math.sin(t*13)*0.45;
    P.legFR.rotation.x=-0.25+Math.sin(t*13+1.5)*0.35;
  }
  else if(st==='lie'||st==='sleep'){
    b.position.y=-0.205;
    P.legFL.scale.y=0.3; P.legFR.scale.y=0.3; P.legRL.scale.y=0.3; P.legRR.scale.y=0.3;
    P.legFL.rotation.x=-0.9; P.legFR.rotation.x=-0.9; P.legRL.rotation.x=0.7; P.legRR.rotation.x=0.7;
    P.headGrp.position.set(0,0.44,0.42); P.headGrp.rotation.x=0.3;
    var slow=st==='sleep'?1.15:2.0, ampB=st==='sleep'?0.045:0.02;
    var brS=1+Math.sin(t*slow)*ampB; b.scale.set(brS,brS,1);
    if(st==='sleep'){
      eyeS=0.06;
      pug.twT-=dt;
      if(pug.twT&lt;=0){ pug.tw=0.4; pug.twT=rand(4,8); }
      if(pug.tw&gt;0){ pug.tw-=dt; P.legRL.rotation.x+=Math.sin(pug.tw*40)*0.3; }
      if(pug.jolt&gt;0){
        pug.jolt-=dt*2.2;
        P.headGrp.rotation.x=0.3+0.06*pug.jolt*Math.sin(t*25);
        P.chin.position.y=-0.108+0.006*Math.sin(t*25)*pug.jolt;
      }
      wag=0.15;
    }
  }
  else if(st==='hop'||st==='jump'){
    P.legFL.rotation.x=-0.7; P.legFR.rotation.x=-0.7; P.legRL.rotation.x=0.7; P.legRR.rotation.x=0.7;
    P.headGrp.rotation.x=-0.2;
  }
  P.ears[0].rotation.set(0.55+earB,0,-0.5);
  P.ears[1].rotation.set(0.55+earB,0,0.5);
  P.tailGrp.rotation.y=Math.sin(t*(4+wag*4))*(0.25+wag*0.25);
  P.tailGrp.rotation.x=Math.sin(t*3)*0.08;
  P.eyes[0].scale.y=eyeS; P.eyes[1].scale.y=eyeS;
}

function regionDist(){
  var p=pug.pos;
  if(G.sleeping) return 11;
  if(p.z&lt;-7) return 7.4;
  if(p.x&gt;4&amp;&amp;p.z&lt;0) return 4.3;
  if(p.x&gt;4&amp;&amp;p.z&gt;=0) return 4.9;

function pointBlocked(x,z){
  for(var i=0;i&lt;colliders.length;i++){
    var c=colliders[i];
    if(
      x &gt; c.minX - 0.12 &amp;&amp;
      x &lt; c.maxX + 0.12 &amp;&amp;
      z &gt; c.minZ - 0.12 &amp;&amp;
      z &lt; c.maxZ + 0.12
    ){
      return true;
    }
  }
  return false;
}
function pointBlockedInflated(x,z,r){
  for(var i=0;i&lt;colliders.length;i++){
    var c=colliders[i];
    if(x&gt;c.minX-r&amp;&amp;x&lt;c.maxX+r&amp;&amp;z&gt;c.minZ-r&amp;&amp;z&lt;c.maxZ+r) return true;
  }
  return false;
}
function updateCamera(dt){
  var calm=settings.calmCam;
  var lagK=calm?2.0:5.5;
  var k=1-Math.exp(-dt*lagK);
  cam.dist=lerp(cam.dist,regionDist(),G.sleeping?dt*0.7:k);
  cam.pitch=G.sleeping?lerp(cam.pitch,0.56,dt*0.6):0.42;
  if(G.mode==='finale'&amp;&amp;!calm) cam.yaw+=dt*0.045;

  var fx=pug.pos.x, fy=0.5+(G.sleeping?0.25:0), fz=pug.pos.z;
  if(G.sleeping){ fx=bedCX; fz=bedCZ; fy=0.85; }
  cam.focus.set(fx,fy,fz);

  var hd=cam.dist*Math.cos(cam.pitch), vd=cam.dist*Math.sin(cam.pitch)+0.35;
  cam.tmpPos.set(fx-Math.sin(cam.yaw)*hd, fy+vd, fz-Math.cos(cam.yaw)*hd);

  if(!G.sleeping){
    cam.tmpDir.copy(cam.tmpPos).sub(cam.focus);
    var maxT=1;
    for(var i=1;i&lt;=16;i++){
      var t=i/16;
      var px=cam.focus.x+cam.tmpDir.x*t, pz=cam.focus.z+cam.tmpDir.z*t;
      var py=cam.focus.y+cam.tmpDir.y*t;
      if(pointBlocked(px,pz)||py&lt;0.35){ maxT=Math.max((i-1)/16,0.18); break; }
    }
    if(maxT&lt;1) cam.tmpPos.copy(cam.focus).addScaledVector(cam.tmpDir,maxT*0.95);
    if(cam.tmpPos.y&lt;0.4) cam.tmpPos.y=0.4;
  }
  camera.position.lerp(cam.tmpPos,k);
  cam.look.lerp(cam.focus,1-Math.exp(-dt*(calm?3:8)));
  camera.lookAt(cam.look);
}

function collideCircle(pos,r){
  for(var pass=0;pass&lt;2;pass++){
    for(var i=0;i&lt;colliders.length;i++){
      var c=colliders[i];
      if(pos.x&gt;c.minX-r&amp;&amp;pos.x&lt;c.maxX+r&amp;&amp;pos.z&gt;c.minZ-r&amp;&amp;pos.z&lt;c.maxZ+r){
        var pl=pos.x-(c.minX-r), pr=(c.maxX+r)-pos.x;
        var pb=pos.z-(c.minZ-r), pf=(c.maxZ+r)-pos.z;
        var m=Math.min(pl,pr,pb,pf);
        if(m===pl) pos.x=c.minX-r; else if(m===pr) pos.x=c.maxX+r;
        else if(m===pb) pos.z=c.minZ-r; else pos.z=c.maxZ+r;
      }
    }
  }
  pos.x=clamp(pos.x,-9.7,10.25); pos.z=clamp(pos.z,-13.8,6.75);
}

function startSeq(steps,onDone){ seq={steps:steps,i:0,t:0,onDone:onDone}; }
function updateSeq(dt){
  if(!seq) return false;
  var st=seq.steps[seq.i];
  if(seq.t===0&amp;&amp;st.begin) st.begin();
  seq.t+=dt;
  var k=clamp(seq.t/st.d,0,1);
  if(st.tick) st.tick(k,dt);
  if(seq.t&gt;=st.d){
    if(st.end) st.end();
    seq.i++; seq.t=0;
    if(seq.i&gt;=seq.steps.length){ var cb=seq.onDone; seq=null; if(cb) cb(); }
  }
  return true;
}

    AudioSys.fail(); hapticNotify('warning');
    showPhrase('Слишком рано. Нужен другой подход');
    setPugState('hop');
    startSeq([
      {d:0.5, tick:function(k){ pug.visualYOffset=Math.sin(k*Math.PI)*0.28; },
        end:function(){ pug.visualYOffset=0; setPugState('idle'); }}
    ]);
    return;
  }
  startBedSeq();
}

function startBedSeq(){
  G.inputLocked=true; setQuest(8);
  showPhrase('Простыня слишком ровная. Сейчас исправим');
  var sx=pug.pos.x, sz=pug.pos.z;
  var tx=bedCX, tz=bedCZ-0.2;
  var startYaw=pug.yaw;
  var crumpShown=0;
  startSeq([
    {d:0.8, begin:function(){ setPugState('jump'); AudioSys.jump(); hapticImpact('soft'); pug.forcedYaw=yawTo(sx,sz,tx,tz); },
      tick:function(k){
        pug.pos.x=lerp(sx,tx,k); pug.pos.z=lerp(sz,tz,k);
        pug.visualYOffset=Math.sin(k*Math.PI)*(bedTop+0.25);
      },
      end:function(){ pug.groundY=bedTop; pug.visualYOffset=0; pug.onBed=true; }},
    {d:3.0, begin:function(){ setPugState('dig'); AudioSys.dig(); },
      tick:function(k,dt){
        pug.digP+=dt;
        if(pug.digP&gt;0.45){ pug.digP=0; AudioSys.dig();
          if(crumpShown&lt;crumpleGrp.children.length){ crumpleGrp.children[crumpShown].visible=true; crumpShown++; } }
      }},
    {d:2.4, begin:function(){ setPugState('spin'); },
      tick:function(k){ pug.yaw=startYaw+k*Math.PI*4; }},
    {d:1.2, begin:function(){ setPugState('lie'); }},
    {d:0.8, begin:function(){ setPugState('sleep'); G.sleeping=true; setQuest(9); setMood(100); }}
  ],function(){ pug.forcedYaw=null; });
}

/* ============================================================
   16. ВЗАИМОДЕЙСТВИЯ
============================================================ */
function nearestInteract(){
  var p=pug.pos, best=null, bd=1e9;
  function consider(x,z,r,label,short,fn){
    var d=Math.sqrt(dist2(p.x,p.z,x,z));
    if(d&lt;r&amp;&amp;d&lt;bd){ bd=d; best={label:label,short:short,fn:fn}; }
  }
  if(G.quest===4) consider(humanRoot.position.x,humanRoot.position.z,1.5,'E — Сесть и начать переговоры','Говорить',startBegSeq);
  if(G.quest===5&amp;&amp;!G.leashPicked) consider(9.45,-4.3,1.3,'E — Взять поводок','Взять',function(){
    G.leashPicked=true; G.hasLeash=true; leashWorld.visible=false; setCarriedLeashVisible(true);
    AudioSys.pickup(); setMood(G.happiness+8);
    setQuestText('Отнеси поводок к входной двери');
    showPhrase('Поводок сам себя не принесёт');
  });
  if(G.quest===5&amp;&amp;G.hasLeash&amp;&amp;!G.doorSeqStarted){
    consider(5.8,-6.5,1.6,'E — Положить поводок и попроситься гулять','ГУЛЯТЬ',function(){
      if(G.doorSeqStarted) return;
      G.doorSeqStarted=true;
      startDoorSeq();
    });
  }
  if(!G.tokenFound) consider(0.6,-4.05,1.05,'E — Что-то блеснуло под диваном','Найти',function(){
    G.tokenFound=true; tokenGrp.visible=false;
    spawnBurst(0.6,0.2,-4.05); AudioSys.collect(); setMood(G.happiness+10);
    showPhrase('Это была не крошка. Это была улика');
    unlockAch('sel');
  });
  if(G.quest===7&amp;&amp;!G.sleeping){
    var db=clamp(pug.pos.x,6.0,8.6);
    var dz=clamp(pug.pos.z,2.7,5.95);
    if(Math.sqrt(dist2(p.x,p.z,db,dz))&lt;1.35) consider(db,dz,1.4,'E — Запрыгнуть на кровать','Прыгнуть',tryBedAction);
  }
  return best;
}
function nearestSmell(){
  var p=pug.pos;
  for(var i=0;i&lt;smellPts.length;i++){
    var s=smellPts[i];
    if(!s.done&amp;&amp;dist2(p.x,p.z,s.x,s.z)&lt;0.85) return s;
  }
  return null;
}

/* ============================================================
   17. ОБНОВЛЕНИЕ ИГРЫ
============================================================ */
var tmpV=new THREE.Vector3();
function updatePlaying(dt){
  G.time+=dt;
  G.bumpCd-=dt;

  var inSeq=updateSeq(dt);

  if(!inSeq&amp;&amp;!G.inputLocked&amp;&amp;!G.sleeping){
    var iv=inputVec();
    var run=(keys['ShiftLeft']||keys['ShiftRight']||touchRun);
    var speed=run?3.5:1.9;
    var fx=Math.sin(cam.yaw), fz=Math.cos(cam.yaw);
    var rx=-fz, rz=fx;
    var mx=fx*iv.z+rx*iv.x, mz=fz*iv.z+rz*iv.x;
    var acc=12;
    pug.vel.x=lerp(pug.vel.x,mx*speed*iv.mag,clamp(acc*dt,0,1));
    pug.vel.z=lerp(pug.vel.z,mz*speed*iv.mag,clamp(acc*dt,0,1));
    var sp=Math.sqrt(pug.vel.x*pug.vel.x+pug.vel.z*pug.vel.z);
    if(sp&lt;0.05){ pug.vel.set(0,0,0); sp=0; }
    pug.pos.x+=pug.vel.x*dt; pug.pos.z+=pug.vel.z*dt;
    collideCircle(pug.pos,0.32);
    pug.moveAmt=lerp(pug.moveAmt,clamp(sp/3.2,0,1),dt*8);
    if(sp&gt;0.15){
      pug.walkPhase+=sp*dt*5.5;
      pug.yaw=angleLerp(pug.yaw,Math.atan2(pug.vel.x,pug.vel.z),clamp(dt*11,0,1));
      setPugState('walk');
      G.stepDist+=sp*dt;
      if(G.stepDist&gt;0.55){ G.stepDist=0; AudioSys.step(run); }
    } else {
      if(pug.forcedYaw!==null) pug.yaw=angleLerp(pug.yaw,pug.forcedYaw,dt*6);
      if(pug.state==='walk') setPugState('idle');
    }
    if(G.quest===1&amp;&amp;pug.pos.x&lt;-3.3){ setQuest(2); activateVacuum(); }
    if(G.quest===6&amp;&amp;G.smells&gt;=3&amp;&amp;pug.pos.z&gt;-6.8&amp;&amp;!G.q7triggered){
      G.q7triggered=true;
      doorAnim.bedroom.target=1; G.bedroomOpen=true; removeCol(bedroomDoorCol); AudioSys.door();
      human.walkTarget={x:HUMAN_LIVING.x,z:HUMAN_LIVING.z};
      setQuest(7);
      showPhrase('На кровать нельзя только до тех пор, пока никто не смотрит');
    }
  } else {
    pug.moveAmt=lerp(pug.moveAmt,0,dt*6);
    if(pug.forcedYaw!==null) pug.yaw=angleLerp(pug.yaw,pug.forcedYaw,clamp(dt*8,0,1));
  }
  pugRoot.position.set(pug.pos.x, pug.groundY + pug.visualYOffset, pug.pos.z);
  pugRoot.rotation.y=pug.yaw;

  if(actionQueued){
    actionQueued=false;
    if(!inSeq&amp;&amp;!G.inputLocked&amp;&amp;!G.sleeping){
      var it=nearestInteract();
      if(it) it.fn();
    }
  }

  if(G.quest&gt;=6&amp;&amp;!inSeq&amp;&amp;!G.inputLocked&amp;&amp;!G.sleeping){
    var sm=nearestSmell();
    if(sm&amp;&amp;actionHeld){
      setPugState('sniff');
      sm.progress+=dt/2.0;
      setHold(clamp(sm.progress,0,1));
      if(Math.random()&lt;dt*1.5) AudioSys.snort();
      if(sm.progress&gt;=1){
        sm.done=true; sm.disc.visible=false; sm.ring.visible=false;
        G.smells++; updateCounters(); setMood(G.happiness+8);
        AudioSys.collect(); setHold(null);
        showPhrase(SMELL_PHRASES[Math.floor(Math.random()*SMELL_PHRASES.length)]);
        setPugState('idle');
        if(G.smells&gt;=3&amp;&amp;!G.q6announced){ G.q6announced=true; setQuestText('Двор проверен. Пора домой'); }
      }
    } else {
      setHold(sm&amp;&amp;!sm.done?clamp(sm.progress,0,1):null);
      if(pug.state==='sniff') setPugState('idle');
    }
  } else setHold(null);

  if(G.quest===3){ G.q3t-=dt; if(G.q3t&lt;=0) setQuest(4); }

  for(var i=0;i&lt;crumbs.length;i++){
    var c=crumbs[i];
    if(c.taken) continue;
    c.ph+=dt*3;
    c.mesh.position.y=0.1+Math.sin(c.ph)*0.03;
    c.mesh.rotation.y+=dt*2;
    if(!G.sleeping&amp;&amp;dist2(pug.pos.x,pug.pos.z,c.x,c.z)&lt;0.32) collectCrumb(c);
  }
  if(!G.tokenFound){ tokenGrp.rotation.y+=dt*2; var ts=1+Math.sin(G.time*4)*0.12; tokenGrp.scale.set(ts,ts,ts); }

  if(G.vacuumActive&amp;&amp;!vac.docked){
    vac.turnT-=dt;
    if(vac.turnT&lt;=0){ vac.turnT=rand(2,4.5); var a=Math.atan2(vac.dir.z,vac.dir.x)+rand(-1.2,1.2); vac.dir.set(Math.cos(a),0,Math.sin(a)); }
    var npos=tmpV.set(vac.pos.x+vac.dir.x*1.15*dt,0,vac.pos.z+vac.dir.z*1.15*dt);
    var blocked=false;
    for(var ci=0;ci&lt;colliders.length;ci++){
      var cc=colliders[ci];
      if(npos.x&gt;cc.minX-0.3&amp;&amp;npos.x&lt;cc.maxX+0.3&amp;&amp;npos.z&gt;cc.minZ-0.3&amp;&amp;npos.z&lt;cc.maxZ+0.3){ blocked=true; break; }
    }
    if(npos.x&lt;-9.4||npos.x&gt;3.6||npos.z&lt;-6.4||npos.z&gt;6.4) blocked=true;
    if(blocked){
      if(Math.abs(vac.dir.x)&gt;Math.abs(vac.dir.z)) vac.dir.x*=-1; else vac.dir.z*=-1;
      var a2=Math.atan2(vac.dir.z,vac.dir.x)+rand(-0.5,0.5);
      vac.dir.set(Math.cos(a2),0,Math.sin(a2));
    } else { vac.pos.x=npos.x; vac.pos.z=npos.z; }
    vacRoot.position.set(vac.pos.x,0,vac.pos.z);
    vacRoot.rotation.y=Math.atan2(vac.dir.x,vac.dir.z);
    if(G.bumpCd&lt;=0&amp;&amp;!pug.onBed&amp;&amp;dist2(vac.pos.x,vac.pos.z,pug.pos.x,pug.pos.z)&lt;0.36){
      G.bumpCd=2; G.vacuumHits++; hapticImpact('medium');
      if(G.quest===2&amp;&amp;G.crumbs&gt;0){
        G.crumbs--; dropStolenCrumb(); updateCounters();
      }
      AudioSys.snort();
      showPhrase('Пылесос опять всё испортил');
      if(!seq){
        setPugState('hop');
        startSeq([{d:0.55, tick:function(k){ pug.visualYOffset=Math.sin(k*Math.PI)*0.35; },
          end:function(){ pug.visualYOffset=0; setPugState('idle'); }}]);
      }
    }
  }
  if(G.quest&gt;=7&amp;&amp;G.vacuumActive) dockVacuum();

  if(human.walkTarget){
    var hx=humanRoot.position.x, hz=humanRoot.position.z;
    var dx=human.walkTarget.x-hx, dz=human.walkTarget.z-hz;
    var dl=Math.sqrt(dx*dx+dz*dz);
    if(dl&gt;0.08){
      humanRoot.position.x+=dx/dl*1.15*dt; humanRoot.position.z+=dz/dl*1.15*dt;
      humanRoot.rotation.y=Math.atan2(dx,dz);
      human.bob+=dt*8;
      var sw2=Math.sin(human.bob);
      H.legL.rotation.x=sw2*0.45; H.legR.rotation.x=-sw2*0.45;
      H.armL.rotation.x=-sw2*0.3; H.armR.rotation.x=sw2*0.3;
      humanRoot.position.y=Math.abs(Math.cos(human.bob))*0.025;
    } else { human.walkTarget=null; humanRoot.position.y=0; human.lookT=1.5; }
  } else {
    H.legL.rotation.x=lerp(H.legL.rotation.x,0,dt*8);
    H.legR.rotation.x=lerp(H.legR.rotation.x,0,dt*8);
    H.armL.rotation.x=lerp(H.armL.rotation.x,Math.sin(G.time*1.8)*0.04,dt*4);
    H.armR.rotation.x=lerp(H.armR.rotation.x,-Math.sin(G.time*1.8)*0.04,dt*4);
    humanRoot.position.y=lerp(humanRoot.position.y,0,dt*8);
  }
  if(G.quest===7&amp;&amp;!G.sleeping&amp;&amp;!human.walkTarget){
    human.lookT-=dt;
    if(human.lookT&lt;=0){
      G.humanLooking=!G.humanLooking;
      human.lookT=G.humanLooking?rand(3,4.6):rand(3.2,6);
      human.yawTarget=G.humanLooking?LOOK_YAW:AWAY_YAW;
      setWatch(G.humanLooking);
    }
    humanRoot.rotation.y=angleLerp(humanRoot.rotation.y,human.yawTarget,dt*4);
    H.eyeSprite.visible=G.humanLooking;
  } else if(G.quest!==7){ H.eyeSprite.visible=false; }
  var headT=(G.quest===7&amp;&amp;G.humanLooking)?0.55:0;
  H.headGrp.rotation.y=angleLerp(H.headGrp.rotation.y,headT,dt*5);

  ['front','bedroom'].forEach(function(nm){
    var d=doorAnim[nm];
    d.open=lerp(d.open,d.target,dt*3);
    var grp=nm==='front'?frontDoorGrp:bedroomDoorGrp;
    grp.rotation.y=-d.open*1.75;
  });

  arrowT+=dt;
  updateArrow();

  if(G.quest&gt;=2&amp;&amp;G.quest&lt;=6&amp;&amp;!seq){
    G.ambientT-=dt;
    if(G.ambientT&lt;=0){ G.ambientT=rand(18,32); showPhrase(PHRASES[Math.floor(Math.random()*PHRASES.length)]); }
  }

  if(G.sleeping){
    G.sleepT+=dt;
    G.snoreT-=dt;
    if(G.snoreT&lt;=0){ G.snoreT=1.9; pug.jolt=1; AudioSys.snore(); }
    if(G.sleepT&gt;5.2&amp;&amp;!G.finished){
      G.finished=true; G.finalTime=G.time;
      el.fade.classList.add('on');
    }
    if(G.sleepT&gt;7.4&amp;&amp;el.screenFinale.classList.contains('hidden')){
      openFinale();
    }
  }

  updateParticles(dt);
  animatePug(dt);
  updateCamera(dt);

  if(!inSeq&amp;&amp;!G.inputLocked&amp;&amp;!G.sleeping){
    var sm2=nearestSmell();
    var it2=sm2?{label:'Удерживай E — изучить запах ('+sm2.label+')',short:'Нюхать'}:nearestInteract();
    if(it2) setPrompt(it2.label,it2.short); else setPrompt(null);
  } else setPrompt(null);
}

function updateArrow(){
  var t=null;
  if(G.quest===1) t={x:-3,y:1.9,z:0};
  else if(G.quest===2){
    var bd=1e9,bc=null;
    for(var i=0;i&lt;crumbs.length;i++){ var c=crumbs[i]; if(c.taken) continue;
      var d=dist2(pug.pos.x,pug.pos.z,c.x,c.z); if(d&lt;bd){bd=d;bc=c;} }
    if(bc) t={x:bc.x,y:1.1,z:bc.z};
  }
  else if(G.quest===4) t={x:humanRoot.position.x,y:2.3,z:humanRoot.position.z};
  else if(G.quest===5) t=G.leashPicked?{x:5.8,y:1.9,z:-6.6}:{x:9.45,y:1.9,z:-4.3};
  else if(G.quest===6) t=G.smells&gt;=3?{x:5.8,y:1.9,z:-6.6}:nearestSmellArrow();
  else if(G.quest===7&amp;&amp;!G.sleeping) t={x:bedCX,y:1.7,z:bedCZ};
  if(t){ arrow.visible=true; arrow.position.set(t.x,t.y+Math.sin(arrowT*3)*0.12,t.z); }
  else arrow.visible=false;
}
function nearestSmellArrow(){
  var bd=1e9,bs=null;
  for(var i=0;i&lt;smellPts.length;i++){ var s=smellPts[i]; if(s.done) continue;
    var d=dist2(pug.pos.x,pug.pos.z,s.x,s.z); if(d&lt;bd){bd=d;bs=s;} }
  return bs?{x:bs.x,y:1.0,z:bs.z}:{x:5.8,y:1.9,z:-8.5};
}

function openFinale(){
  G.mode='finale'; G.erzIdle=0;
  disableGameClosingConfirmation();
  el.finCrumbs.textContent=G.crumbs+' / 10';
  el.finSmells.textContent=G.smells+' / 3';
  el.finTime.textContent=fmtTime(G.finalTime);
  el.finVacuum.textContent=G.vacuumHits;
  el.finAttempts.textContent=G.bedAttempts;
  if(bestTime===null||G.finalTime&lt;bestTime){ bestTime=G.finalTime; saveBest(); }
  if(G.vacuumHits===0) unlockAch('hitry');
  if(G.tokenFound) unlockAch('king');
  el.watchInd.classList.add('hidden');
  setPrompt(null);
  showScreen('screen-finale');
}

  pugRoot.position.set(0.6,0,-1.4); pugRoot.rotation.y=pug.yaw;

  cam.yaw=-2.4; cam.dist=4.6; cam.focus.set(0.6,0.5,-1.4); cam.look.copy(cam.focus);
  camera.position.set(4,2.3,2.3);

function restoreLoopingSounds() {
  if (
    settings.sound &amp;&amp;
    G.mode === 'playing' &amp;&amp;
    G.vacuumActive &amp;&amp;
    !vac.docked
  ) {
    AudioSys.startHum();
  }
}
function pauseGame(){
  if(G.mode!=='playing'||G.paused) return;

  resetInputState();
  AudioSys.stopHum();

  G.paused=true;
  showScreen('screen-pause');
}
function resumeGame(){
  G.paused=false;
  showScreen(null);
  lastT=performance.now();
  AudioSys.resume().then(function(ok){
    if(ok) restoreLoopingSounds();
  });
}
document.addEventListener('visibilitychange',function(){
  if(document.hidden){
    if(G.mode==='playing'&amp;&amp;!G.paused&amp;&amp;!pausedByOrientation) pauseGame();
  } else {
    if(settings.sound&amp;&amp;AudioSys.ctx&amp;&amp;AudioSys.ctx.state==='suspended'){
      var once=function(){
        AudioSys.resume().then(function(ok){ if(ok) syncSettingsUI(); });
        window.removeEventListener('pointerdown',once);
        window.removeEventListener('keydown',once);
      };
      window.addEventListener('pointerdown',once);
      window.addEventListener('keydown',once);
    }
  }
});
window.addEventListener('blur',function(){ if(G.mode==='playing'&amp;&amp;!G.paused&amp;&amp;!pausedByOrientation) pauseGame(); });

var mqPortrait=window.matchMedia('(orientation: portrait)');
function checkOrientation(){
  var portrait=IS_TOUCH&amp;&amp;(window.innerHeight&gt;window.innerWidth);
  el.portraitWarning.classList.toggle('hidden',!portrait);

  if(portrait){

function enableSoundFromGesture(showMessage){
  AudioSys.setSound(true);

  return AudioSys.ensure().then(function(ok){
    if(ok){
      AudioSys.startSound();
      restoreLoopingSounds();

    syncSettingsUI();
    return ok;
  });
}

  if(a==='smells'){

    smellPts.forEach(function(s0){ s0.done=true; s0.disc.visible=false; s0.ring.visible=false; });

var lastT=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  var dt=(now-lastT)/1000; lastT=now;
  if(dt&gt;0.05) dt=0.05;

  if(!G.paused&amp;&amp;!pausedByOrientation){
    if(G.mode==='playing'){
      updatePlaying(dt);
    } else if(G.mode==='menu'){
      animatePug(dt);
      updateCamera(dt);
    } else if(G.mode==='finale'){
      animatePug(dt);
      G.snoreT-=dt;
      if(G.snoreT&lt;=0){ G.snoreT=1.9; pug.jolt=1; AudioSys.snore(); }
      for(var i=0;i&lt;zzz.length;i++){
        var z=zzz[i]; z.t+=dt*0.55;
        if(z.t&gt;2) z.t-=2;
        z.sp.position.set(bedCX+0.5+Math.sin(z.t*3)*0.15, 1.1+z.t*0.55, bedCZ-0.3);
        z.sp.material.opacity=Math.sin(clamp(z.t/2,0,1)*Math.PI)*0.9;
        var sc=0.3+z.t*0.18; z.sp.scale.set(sc,sc,1);
      }
      G.erzIdle+=dt;
      if(G.erzIdle&gt;=20&amp;&amp;!G.erzUnlocked){ G.erzUnlocked=true; unlockAch('erzhan'); }
      updateCamera(dt);
      updateParticles(dt);
    }
  }
  renderer.render(scene,camera);
}

function setupHomeScreenButton() {
  const button = $('btn-add-home');
  const tg = TelegramApp.tg;

  button.classList.add('hidden');

  if (
    !TelegramApp.isTelegram ||
    !tg ||
    typeof tg.checkHomeScreenStatus !== 'function' ||
    typeof tg.addToHomeScreen !== 'function'
  ) {
    return;
  }

  try {
    tg.onEvent('homeScreenAdded', function(){
      button.classList.add('hidden');
    });
  } catch (error) {}

  try {
    tg.checkHomeScreenStatus(function(status) {
      if (status === 'unsupported' || status === 'added') {
        button.classList.add('hidden');
        return;
      }

      button.classList.remove('hidden');
    });
  } catch (error) {
    console.warn('Home screen status warning:', error);
  }
}

function handleTgBack(){
  try{ hapticImpact('light'); }catch(e){}
  if(isSettingsOpen()){
    if(settingsReturnTo==='pause'){ settingsReturnTo='pause'; showScreen('screen-pause'); }
    else showScreen('screen-start');
    return;
  }
  if(isControlsOpen()){ showScreen('screen-start'); return; }
  if(isScreenOpen('screen-achievements')){ showScreen('screen-start'); return; }
  if(isScreenOpen('screen-finale')){
    disableGameClosingConfirmation();
    resetGame(); refreshBestLine(); showScreen('screen-start'); el.hud.classList.add('hidden');
    return;
  }
  if(isScreenOpen('screen-pause')){
    disableGameClosingConfirmation();
    resetGame(); refreshBestLine(); showScreen('screen-start'); el.hud.classList.add('hidden');
    return;
  }
  if(G.mode==='playing'){
    if(G.paused) resumeGame(); else pauseGame();
  }
}
function setupTelegram(){
  if(!TelegramApp.isTelegram) return;

  TelegramApp.init();
  setupHomeScreenButton();

  var tg=TelegramApp.tg;
  if(!tg) return;

  try{
    tg.onEvent('viewportChanged', function(){ onResize(); });
    tg.onEvent('safeAreaChanged', function(){ onResize(); });
    tg.onEvent('contentSafeAreaChanged', function(){ onResize(); });
    tg.onEvent('fullscreenChanged', function(){ onResize(); });
    tg.onEvent('fullscreenFailed', function(e){ console.warn('Telegram fullscreenFailed:', e); });
  }catch(e){ console.warn('Telegram event subscribe warning:', e); }

  try{
    tg.onEvent('deactivated', function(){
      if(G.mode==='playing'&amp;&amp;!G.paused&amp;&amp;!pausedByOrientation) pauseGame();
      AudioSys.stopHum();
    });
    tg.onEvent('activated', function(){
      onResize(); /* звук не запускаем без взаимодействия пользователя */
    });
  }catch(e){ console.warn('Telegram lifecycle warning:', e); }

  try{
    if(tg.BackButton){
      tgBack=tg.BackButton;
      tgBack.onClick(handleTgBack);
      tgBack.hide();
    }
  }catch(e){ console.warn('Telegram BackButton warning:', e); }

  try{
    var firstName=tg.initDataUnsafe&amp;&amp;tg.initDataUnsafe.user&amp;&amp;tg.initDataUnsafe.user.first_name;
    if(firstName){
      el.tgGreet.textContent='Матвей ждёт, '+firstName;
      el.tgGreet.classList.remove('hidden');
    }
  }catch(e){}
}

name: Audit live GitHub Pages

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: read
  deployments: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect GitHub Pages configuration and live resources
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          LIVE_BASE: https://jv6hgy9sby-ops.github.io/nastya-hr
        run: |
          set -euo pipefail
          stamp="$(date +%s)"

          echo '=== PAGES CONFIGURATION ==='
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/pages" | tee pages-config.json
          echo

          echo '=== RECENT GITHUB-PAGES DEPLOYMENTS ==='
          curl -fsSL \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/deployments?environment=github-pages&per_page=10" | tee pages-deployments.json
          echo

          echo '=== LIVE PAGE HEADERS ==='
          curl -fsSL -D page-headers.txt -o live-solutions.html \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            "${LIVE_BASE}/solutions.html?audit=${stamp}"
          cat page-headers.txt
          echo

          echo '=== LIVE HTML HEAD ==='
          sed -n '1,25p' live-solutions.html
          echo

          echo '=== LIVE HTML MARKERS ==='
          grep -nE 'theme-init|styles\.css|themes\.css|contrast-fix|Три сценария|Три примера|HR AI Assistant' live-solutions.html | head -30 || true
          echo

          for asset in assets/theme-init.js assets/themes.css assets/contrast-fix.css; do
            safe="$(echo "$asset" | tr '/.' '__')"
            echo "=== ASSET: ${asset} ==="
            status="$(curl -sS -w '%{http_code}' -D "${safe}.headers" -o "${safe}.body" \
              -H 'Cache-Control: no-cache' \
              -H 'Pragma: no-cache' \
              "${LIVE_BASE}/${asset}?audit=${stamp}")"
            echo "HTTP ${status}"
            cat "${safe}.headers"
            echo '--- body markers ---'
            grep -nE 'assetVersion|contrast-fix|featured-solution\.primary|color:#FAF7F2|color:var\(--color-on-dark\)' "${safe}.body" | head -30 || true
            echo
          done

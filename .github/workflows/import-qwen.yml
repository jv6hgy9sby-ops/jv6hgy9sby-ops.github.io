name: Clean imported Qwen game

on:
  push:
    paths:
      - '.github/workflows/import-qwen.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Remove Qwen iframe wrapper
        run: |
          node <<'EOF'
          const fs = require('fs');
          const source = fs.readFileSync('index.html', 'utf8');
          const marker = '<html lang="ru">';
          const markerIndex = source.indexOf(marker);
          const start = source.lastIndexOf('<!DOCTYPE html>', markerIndex);
          const end = source.indexOf('</html>', markerIndex);

          if (markerIndex < 0 || start < 0 || end < 0) {
            throw new Error('Не найден чистый HTML игры внутри Qwen wrapper.');
          }

          const html = source.slice(start, end + '</html>'.length).trim() + '\n';
          const required = ['Матвей Селёдочник', 'telegram-web-app.js', 'canvas-holder'];
          for (const value of required) {
            if (!html.includes(value)) throw new Error('В игре отсутствует маркер: ' + value);
          }
          if (html.includes('id="htmlIframe"') || html.includes('window.parent.postMessage')) {
            throw new Error('Qwen wrapper не был полностью удалён.');
          }

          fs.writeFileSync('index.html', html, 'utf8');
          console.log('Clean index.html bytes:', Buffer.byteLength(html));
          EOF

      - name: Commit clean game
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Remove Qwen wrapper from Matvey game'
          git push

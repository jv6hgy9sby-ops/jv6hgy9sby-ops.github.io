name: Extract game core

on:
  push:
    paths:
      - '.github/workflows/extract-core.yml'
      - 'tools/extract-core.js'
      - 'debug/extract-trigger.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Extract and inspect core
        run: node tools/extract-core.js
      - name: Commit extracted core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debug/game-core-decoded.js debug/core-analysis.txt
          git diff --cached --quiet || git commit -m "Extract readable game core for mobile input repair"
          git push

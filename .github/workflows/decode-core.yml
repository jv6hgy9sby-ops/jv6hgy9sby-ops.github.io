name: Decode game core

on:
  push:
    paths:
      - '.github/workflows/decode-core.yml'
      - 'tools/decode-core.js'
      - 'assets/core-v3-*.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node tools/decode-core.js
      - name: Commit decoded core
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game-core-v3.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Decode game core for maintenance"
            git push
          fi

name: TalentBase contact UX one-shot patch

on:
  push:
    branches:
      - feature/talentbase-contact-status-analytics

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/talentbase-contact-status-analytics
          fetch-depth: 0

      - name: Patch TalentBase standalone preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('talentbase/index.html')
          html = path.read_text(encoding='utf-8')

          def rep(old, new, label):
              global html
              count = html.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly 1 match, got {count}')
              html = html.replace(old, new, 1)

          css = r'''
/* ============ CONTACT STATUS / ANALYTICS V2 ============ */
.d-ready{background:#8a97a3}.d-paused{background:#a3a39a}
.cs-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11px;font-weight:600;border:1px solid;white-space:nowrap;line-height:1.5;cursor:pointer}
.cs-chip:hover{filter:brightness(1.05)}
.cs-dot{width:7px;height:7px;border-radius:50%;flex:none}
.cs-gray{background:var(--surface2);color:var(--text2);border-color:var(--border-strong)}
.cs-blue{background:var(--info-soft);color:var(--info);border-color:var(--info-border)}
.cs-amber{background:var(--warn-soft);color:var(--warn);border-color:var(--warn-border)}
.cs-green{background:var(--accent-soft);color:var(--accent-strong);border-color:var(--accent-border)}
.cs-red{background:var(--danger-soft);color:var(--danger);border-color:var(--danger-border)}
.contact-queue-row{display:flex;align-items:center;gap:10px;padding:9px 13px;border-top:1px solid var(--border)}
.contact-queue-row:first-child{border-top:0}
.contact-queue-main{flex:1;min-width:0;text-align:left}
.contact-queue-main b{display:block;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact-queue-main span{display:block;font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-bottom:14px}
@media(min-width:760px){.an-kpis{grid-template-columns:repeat(6,minmax(0,1fr))}}
.an-kpi{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:10px 12px;text-align:left}
.an-kpi b{display:block;font-size:20px;line-height:1.15}.an-kpi span{font-size:11px;color:var(--text2)}
.an-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:1000px){.an-grid{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}}
.an-card{padding:13px}
.an-title{font-size:13px;font-weight:700;margin:0 0 8px}
.an-row{display:grid;grid-template-columns:minmax(112px,168px) minmax(0,1fr) 72px;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--border);width:100%;text-align:left}
.an-row:first-child{border-top:0}
.an-label{font-size:12.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.an-track{height:8px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);overflow:hidden}
.an-fill{display:block;height:100%;border-radius:999px}
.an-green{background:var(--accent)}.an-amber{background:var(--warn)}.an-blue{background:var(--info)}.an-red{background:var(--danger)}.an-gray{background:var(--text3)}.an-neutral{background:var(--border-strong)}
.an-value{text-align:right;font-size:12px;font-weight:700;white-space:nowrap}
.an-action{display:flex;align-items:center;gap:8px;width:100%;padding:9px 0;border-top:1px solid var(--border);text-align:left}
.an-action:first-child{border-top:0}.an-action:hover .an-action-label{color:var(--text)}
.an-action-label{flex:1;font-size:13px;color:var(--text2)}.an-action-value{font-weight:700}
#contactFollowWrap{margin-top:12px;padding-top:12px;border-top:1px solid var(--border)}
@media(min-width:1024px){.pr-status{min-width:142px;align-items:flex-end;justify-content:center}.pr-status .cs-chip{max-width:142px;overflow:hidden;text-overflow:ellipsis}}
'''
          rep('</style>', css + '\n</style>', 'inject CSS')

          rep(
              '<button class="tnav" data-nav="vacancies">Вакансии</button>\n    <button class="tnav" data-nav="import">Импорт</button>',
              '<button class="tnav" data-nav="vacancies">Вакансии</button>\n    <button class="tnav" data-nav="analytics">Аналитика</button>\n    <button class="tnav" data-nav="import">Импорт</button>',
              'desktop analytics nav')
          rep(
              '<button data-nav="vacancies"><svg class="ic"><use href="#i-briefcase"/></svg>Вакансии</button>\n    <button data-nav="import"><svg class="ic"><use href="#i-upload"/></svg>Импорт</button>',
              '<button data-nav="vacancies"><svg class="ic"><use href="#i-briefcase"/></svg>Вакансии</button>\n    <button data-nav="analytics"><svg class="ic"><use href="#i-trend"/></svg>Аналитика</button>\n    <button data-nav="import"><svg class="ic"><use href="#i-upload"/></svg>Импорт</button>',
              'mobile analytics nav')

          rep(
              '<div class="sec-label">Требует внимания</div>',
              '<div class="sec-label">Сегодня · контакты</div>\n      <section class="acc card w-collapse w-open"><button class="acc-h att-h" data-toggle><span class="att-dot dot-blue"></span><span class="acc-t">Очередь контакта</span><span class="cnt" id="cntContact">0</span><svg class="ic chev"><use href="#i-chev-d"/></svg></button><div class="w-body"><div class="w-inner"><div id="homeContact"></div></div></div></section>\n      <div class="sec-label">Требует внимания</div>',
              'home contact queue')

          rep(
              '<div class="f-group"><span class="f-label">Статус обработки</span><div class="f-chips" id="f-status"></div></div><div class="f-group"><span class="f-label">Источник</span>',
              '<div class="f-group"><span class="f-label">Статус обработки</span><div class="f-chips" id="f-status"></div></div><div class="f-group"><span class="f-label">Контакт</span><div class="f-chips" id="f-contact"></div></div><div class="f-group"><span class="f-label">Источник</span>',
              'contact filter UI')

          ready_group = '<section class="acc card w-collapse" data-group="ready"><button class="acc-h" data-toggle><span class="g-dot d-ready"></span><span class="acc-t">В базе</span><span class="acc-meta" data-group-count="ready">0</span><svg class="ic chev"><use href="#i-chev-d"/></svg></button><div class="w-body"><div class="w-inner"><div data-group-list="ready"></div></div></div></section>\n  '
          rep(
              '<section class="acc card w-collapse" data-group="inwork">',
              ready_group + '<section class="acc card w-collapse" data-group="inwork">',
              'ready group')
          paused_group = '<section class="acc card w-collapse" data-group="paused"><button class="acc-h" data-toggle><span class="g-dot d-paused"></span><span class="acc-t">На паузе</span><span class="acc-meta" data-group-count="paused">0</span><svg class="ic chev"><use href="#i-chev-d"/></svg></button><div class="w-body"><div class="w-inner"><div data-group-list="paused"></div></div></div></section>\n  '
          rep(
              '<section class="acc card w-collapse" data-group="archive">',
              paused_group + '<section class="acc card w-collapse" data-group="archive">',
              'paused group')

          analytics_page = r'''
<section class="page" id="page-analytics">
  <div class="page-h"><h1 class="page-title">Аналитика</h1><span class="page-sub">Текущая база · рабочие состояния</span></div>
  <div id="analyticsBox"></div>
</section>

'''
          rep('<section class="page" id="page-settings">', analytics_page + '<section class="page" id="page-settings">', 'analytics page')

          contact_drawer = r'''
<aside class="drawer drawer-right" id="contactDrawer" aria-label="Статус контакта"><div class="drawer-h"><b>Статус контакта</b><button class="iconbtn" data-drawer-close aria-label="Закрыть"><svg class="ic"><use href="#i-x"/></svg></button></div><div class="drawer-b"><div id="contactStatusBody"></div><div id="contactFollowWrap" hidden><div class="field"><label for="contactFollowDate">Дата follow-up</label><input class="input" id="contactFollowDate" type="date"></div><p class="form-note">Contact Status не меняет статус профиля и recruiting-стадию.</p></div></div><div class="drawer-f"><button class="btn btn-primary" data-contact-save><svg class="ic ic-s"><use href="#i-check"/></svg>Сохранить</button></div></aside>
'''
          rep('<aside class="drawer drawer-right" id="renameDrawer"', contact_drawer + '<aside class="drawer drawer-right" id="renameDrawer"', 'contact drawer')

          rep(
              "const GROUPS=[{key:'new',title:'Новые'},{key:'review',title:'На проверке'},{key:'inwork',title:'В работе'},{key:'archive',title:'Архив'}];",
              "const GROUPS=[{key:'new',title:'Новые'},{key:'review',title:'На проверке'},{key:'ready',title:'В базе'},{key:'inwork',title:'В работе'},{key:'paused',title:'На паузе'},{key:'archive',title:'Архив'}];",
              'profile groups JS')
          rep(
              "const STATE_LABEL={new:'Новый',review:'На проверке',inwork:'В работе',archive:'Архив'};",
              "const STATE_LABEL={new:'Новый',review:'На проверке',ready:'В базе',inwork:'В работе',paused:'На паузе',archive:'Архив'};",
              'state labels')
          rep(
              "const STATE_CHIP={new:'c-green',review:'c-amber',inwork:'c-blue',archive:'c-gray'};",
              "const STATE_CHIP={new:'c-green',review:'c-amber',ready:'c-gray',inwork:'c-blue',paused:'c-gray',archive:'c-gray'};",
              'state chips')
          rep(
              "const STATUSES=[{k:'new',l:'Новый',d:'Создан и ещё не разобран OWNER'},{k:'review',l:'На проверке',d:'Конфликт, слабые данные, классификация или возможный дубль'},{k:'inwork',l:'В работе',d:'OWNER реально работает с этим профилем'},{k:'archive',l:'Архив',d:'Сохранён исторически, исключён из активной работы'}];",
              "const STATUSES=[{k:'new',l:'Новый',d:'Создан / импортирован и ещё не разобран OWNER'},{k:'review',l:'На проверке',d:'Слабые данные, конфликт, спорная классификация или возможный дубль'},{k:'ready',l:'В базе',d:'Проверен и релевантен, активной работы сейчас нет'},{k:'inwork',l:'В работе',d:'OWNER сейчас реально работает с этим человеком'},{k:'paused',l:'На паузе',d:'Профиль актуален, но работа временно остановлена'},{k:'archive',l:'Архив',d:'Исторически сохранён, исключён из активной работы'}];\nconst CONTACT_STATUSES=[{k:'none',l:'Не связывались',tone:'gray',dot:'#9aa4a0'},{k:'need',l:'Нужно связаться',tone:'blue',dot:'#5b8fd6'},{k:'call',l:'Позвонить',tone:'blue',dot:'#5b8fd6'},{k:'sent',l:'Написали',tone:'blue',dot:'#5b8fd6'},{k:'waiting',l:'Ждём ответа',tone:'amber',dot:'#d99a2b'},{k:'dialog',l:'В диалоге',tone:'green',dot:'#2fae74'},{k:'followup',l:'Follow-up',tone:'amber',dot:'#d99a2b'},{k:'notint',l:'Не заинтересован',tone:'red',dot:'#b06a6c'},{k:'nocontact',l:'Не контактировать',tone:'red',dot:'#b06a6c'}];\nconst csById=k=>CONTACT_STATUSES.find(c=>c.k===k)||CONTACT_STATUSES[0];",
              'contact status model')
          rep("sourceId:null,directions:[]", "sourceId:null,contactStatus:'none',followUpAt:null,directions:[]", 'profile defaults')

          rep(
              "pickStatus:null,dirPickSearch:'',newDirIcon",
              "pickStatus:null,contactFor:null,pickContact:null,dirPickSearch:'',newDirIcon",
              'contact state fields')
          rep(
              "filters:{dir:new Set(),role:new Set(),status:new Set(),source:new Set(),location:new Set(),verify:new Set(),vac:new Set()}",
              "filters:{dir:new Set(),role:new Set(),status:new Set(),contact:new Set(),source:new Set(),location:new Set(),verify:new Set(),vac:new Set()}",
              'contact filter state')

          fixture_js = "const CONTACT_FIXTURES={p1:{contactStatus:'call'},p4:{contactStatus:'dialog'},p5:{contactStatus:'nocontact'},p8:{contactStatus:'waiting'},p10:{contactStatus:'waiting'},p11:{contactStatus:'followup',followUpAt:new Date().toISOString().slice(0,10),state:'paused'},p12:{contactStatus:'notint'},p15:{contactStatus:'need'},p16:{contactStatus:'none',state:'ready'},p17:{contactStatus:'sent'},p30:{contactStatus:'call'},p35:{contactStatus:'sent'}};Object.entries(CONTACT_FIXTURES).forEach(([id,v])=>{const p=byId(id);if(p)Object.assign(p,v);});"
          rep(
              "const byId=id=>PROFILES.find(p=>p.id===id);const vacById=",
              "const byId=id=>PROFILES.find(p=>p.id===id);" + fixture_js + "const vacById=",
              'contact fixtures')

          rep(
              "function stageChip(st){return `<span class=\"chip ${STAGE_CHIP[st]}\">${STAGE_LABEL[st]}</span>`;}",
              "function stageChip(st){return `<span class=\"chip ${STAGE_CHIP[st]}\">${STAGE_LABEL[st]}</span>`;}function csChipHTML(p){const c=csById(p.contactStatus||'none');const fu=p.contactStatus==='followup'&&p.followUpAt?' · '+String(p.followUpAt).slice(5):'';return `<span class=\"cs-chip cs-${c.tone}\" role=\"button\" tabindex=\"0\" data-open-contact=\"${p.id}\" title=\"Изменить статус контакта\"><span class=\"cs-dot\" style=\"background:${c.dot}\"></span>${esc(c.l+fu)}</span>`;}function csCount(k){return PROFILES.filter(p=>p.state!=='archive'&&(p.contactStatus||'none')===k).length;}",
              'contact helpers')

          rep(
              "function activeFilterCount(){const f=state.filters;return f.dir.size+f.role.size+f.status.size+f.source.size+f.location.size+f.verify.size+f.vac.size;}",
              "function activeFilterCount(){const f=state.filters;return f.dir.size+f.role.size+f.status.size+f.contact.size+f.source.size+f.location.size+f.verify.size+f.vac.size;}",
              'active filter count')
          rep(
              "if(f.status.size&&!f.status.has(p.state))return false;if(f.source.size",
              "if(f.status.size&&!f.status.has(p.state))return false;if(f.contact.size&&!f.contact.has(p.contactStatus||'none'))return false;if(f.source.size",
              'contact match filter')
          rep(
              "$('#f-status').innerHTML=GROUPS.map(g=>chip('status',g.key,g.title)).join('');$('#f-src')",
              "$('#f-status').innerHTML=GROUPS.map(g=>chip('status',g.key,g.title)).join('');$('#f-contact').innerHTML=CONTACT_STATUSES.map(c=>chip('contact',c.k,c.l)).join('');$('#f-src')",
              'contact filter chips')

          rep(
              '<span class="pr-status"><span class="chip ${STATE_CHIP[p.state]}">${STATE_LABEL[p.state]}</span></span>',
              '<span class="pr-status">${csChipHTML(p)}<span class="chip ${STATE_CHIP[p.state]}">${STATE_LABEL[p.state]}</span></span>',
              'profile row contact status')
          rep(
              '<div class="pchips"><span class="chip ${STATE_CHIP[p.state]}">${STATE_LABEL[p.state]}</span>',
              '<div class="pchips">${csChipHTML(p)}<span class="chip ${STATE_CHIP[p.state]}">${STATE_LABEL[p.state]}</span>',
              'profile header contact status')
          rep(
              '</button><button class="btn btn-ghost btn-sm" data-open-status><svg class="ic ic-s"><use href="#i-clock"/></svg>Статус</button>',
              '</button><button class="btn btn-ghost btn-sm" data-open-contact="${p.id}"><svg class="ic ic-s"><use href="#i-phone"/></svg>Контакт</button><button class="btn btn-ghost btn-sm" data-open-status><svg class="ic ic-s"><use href="#i-clock"/></svg>Статус</button>',
              'profile contact action')
          rep(
              '${sc}${stageChip(c.stage)}<select class="stage-sel"',
              '${sc}${csChipHTML(p)}${stageChip(c.stage)}<select class="stage-sel"',
              'vacancy candidate contact status')

          rep(
              "if(page==='home')renderHome();if(page==='profiles')",
              "if(page==='home')renderHome();if(page==='analytics')renderAnalytics();if(page==='profiles')",
              'analytics navigation render')

          extra_js = r'''
function goProfilesStatus(k){Object.values(state.filters).forEach(s=>s.clear());state.filters.status=new Set([k]);state.search='';state.scope='all';const si=$('#searchInput');if(si)si.value='';go('profiles');updateFilterBadge();}
function goContactFilter(keys){Object.values(state.filters).forEach(s=>s.clear());state.filters.contact=new Set(keys);state.search='';state.scope='all';const si=$('#searchInput');if(si)si.value='';go('profiles');updateFilterBadge();}
function renderContactQueue(){const box=$('#homeContact');if(!box)return;const priority=['call','need','followup','waiting','sent','dialog'];const rows=PROFILES.filter(p=>p.state!=='archive'&&priority.includes(p.contactStatus||'none')).sort((a,b)=>priority.indexOf(a.contactStatus)-priority.indexOf(b.contactStatus));$('#cntContact').textContent=rows.length;box.innerHTML=rows.slice(0,8).map(p=>`<div class="contact-queue-row"><button class="contact-queue-main" data-open-profile="${p.id}"><b>${esc(p.name)}</b><span>${esc(p.headline)} · ${esc(p.location)}</span></button>${csChipHTML(p)}</div>`).join('')||emptyHtml('Нет запланированных контактов');}
const renderHomeBase=renderHome;renderHome=function(){renderHomeBase();renderContactQueue();};
function analyticsBar(label,count,total,color,attr){const pct=total?Math.round(count*100/total):0;return `<button class="an-row" ${attr}><span class="an-label">${esc(label)}</span><span class="an-track"><i class="an-fill ${color}" style="width:${pct}%"></i></span><span class="an-value">${count} · ${pct}%</span></button>`;}
function renderAnalytics(){const box=$('#analyticsBox');if(!box)return;const total=PROFILES.length,active=PROFILES.filter(p=>p.state!=='archive').length;const ps={};GROUPS.forEach(g=>ps[g.key]=PROFILES.filter(p=>p.state===g.key).length);const needs=csCount('need')+csCount('call')+csCount('followup')+csCount('waiting');const dupCount=DUPS.filter(d=>d.status==='open').length+pendingDupRecords().length;const stateRows=[['Новый',ps.new,'an-green','new'],['На проверке',ps.review,'an-amber','review'],['В базе',ps.ready,'an-neutral','ready'],['В работе',ps.inwork,'an-blue','inwork'],['На паузе',ps.paused,'an-gray','paused'],['Архив',ps.archive,'an-gray','archive']].map(x=>analyticsBar(x[0],x[1],total,x[2],`data-an-state="${x[3]}"`)).join('');const contactRows=CONTACT_STATUSES.map(c=>{const col=c.tone==='green'?'an-green':c.tone==='amber'?'an-amber':c.tone==='blue'?'an-blue':c.tone==='red'?'an-red':'an-gray';return analyticsBar(c.l,csCount(c.k),active,col,`data-an-contact="${c.k}"`);}).join('');const action=(label,value,attr,tone='')=>`<button class="an-action" ${attr}><span class="an-action-label">${esc(label)}</span><span class="an-action-value" ${tone?`style="color:var(--${tone})"`:''}>${value}</span><svg class="ic ic-s" style="color:var(--text3)"><use href="#i-chev-r"/></svg></button>`;box.innerHTML=`<div class="an-kpis"><button class="an-kpi" data-an-all><b>${total}</b><span>Всего профилей</span></button><button class="an-kpi" data-an-state="new"><b>${ps.new}</b><span>Новые</span></button><button class="an-kpi" data-an-state="review"><b style="color:var(--warn)">${ps.review}</b><span>На Review</span></button><button class="an-kpi" data-an-state="inwork"><b style="color:var(--info)">${ps.inwork}</b><span>В работе</span></button><button class="an-kpi" data-an-contact="followup"><b style="color:var(--warn)">${csCount('followup')}</b><span>Follow-up</span></button><button class="an-kpi" data-an-action><b>${needs}</b><span>Требуют контакта</span></button></div><div class="an-grid"><div><section class="card an-card"><h2 class="an-title">Статус профиля</h2>${stateRows}</section><section class="card an-card" style="margin-top:12px"><h2 class="an-title">Статус контакта</h2>${contactRows}</section></div><section class="card an-card"><h2 class="an-title">Требует действий</h2>${action('Нужно связаться',csCount('need'),'data-an-contact="need"')}${action('Позвонить',csCount('call'),'data-an-contact="call"','info')}${action('Ждём ответа',csCount('waiting'),'data-an-contact="waiting"','warn')}${action('Follow-up',csCount('followup'),'data-an-contact="followup"','warn')}${action('Профили Review',ps.review,'data-an-state="review"','warn')}${action('Возможные дубли',dupCount,'data-an-dups','warn')}</section></div><p class="hint">Цвет здесь обозначает смысл состояния, а не декоративный акцент. Нажатие открывает соответствующий рабочий список.</p>`;}
function openContactDrawer(pid){const p=byId(pid);if(!p)return;state.contactFor=pid;state.pickContact=p.contactStatus||'none';const body=$('#contactStatusBody');body.innerHTML=CONTACT_STATUSES.map(c=>`<button class="vpick ${c.k===state.pickContact?'on':''}" data-contact-pick="${c.k}"><span class="cs-dot" style="background:${c.dot}"></span><span style="flex:1;text-align:left"><span class="vp-t">${esc(c.l)}</span></span><span class="pick-check"><svg class="ic"><use href="#i-check"/></svg></span></button>`).join('');const fw=$('#contactFollowWrap');const fd=$('#contactFollowDate');fw.hidden=state.pickContact!=='followup';fd.value=p.followUpAt||'';openDrawer('contactDrawer');}
function saveContactStatus(){const p=byId(state.contactFor);if(!p||!state.pickContact){closeDrawers();return;}p.contactStatus=state.pickContact;p.followUpAt=state.pickContact==='followup'?($('#contactFollowDate').value||null):null;p.history.unshift({d:'Сегодня, '+nowTime(),t:'Статус контакта: '+csById(p.contactStatus).l+(p.followUpAt?' · '+p.followUpAt:'')});closeDrawers();toast('Контакт: '+csById(p.contactStatus).l);renderGroups();renderHome();if(state.page==='profile')renderProfile(p.id);if(state.page==='vacancy')renderVacancy(state.vacancyId);if(state.page==='analytics')renderAnalytics();}
document.addEventListener('click',e=>{const open=e.target.closest('[data-open-contact]');if(open){e.preventDefault();e.stopImmediatePropagation();openContactDrawer(open.dataset.openContact);return;}const pick=e.target.closest('[data-contact-pick]');if(pick){e.preventDefault();e.stopImmediatePropagation();state.pickContact=pick.dataset.contactPick;$$('#contactStatusBody [data-contact-pick]').forEach(x=>x.classList.toggle('on',x.dataset.contactPick===state.pickContact));$('#contactFollowWrap').hidden=state.pickContact!=='followup';return;}if(e.target.closest('[data-contact-save]')){e.preventDefault();e.stopImmediatePropagation();saveContactStatus();return;}const s=e.target.closest('[data-an-state]');if(s){e.preventDefault();goProfilesStatus(s.dataset.anState);return;}const c=e.target.closest('[data-an-contact]');if(c){e.preventDefault();goContactFilter([c.dataset.anContact]);return;}if(e.target.closest('[data-an-all]')){e.preventDefault();Object.values(state.filters).forEach(x=>x.clear());go('profiles',{scope:'all'});return;}if(e.target.closest('[data-an-action]')){e.preventDefault();goContactFilter(['need','call','waiting','followup']);return;}if(e.target.closest('[data-an-dups]')){e.preventDefault();go('home');const sec=$('#homeDup')?.closest('.w-collapse');if(sec){sec.classList.add('w-open');sec.scrollIntoView({behavior:'smooth',block:'center'});}return;}},true);
document.addEventListener('keydown',e=>{const x=e.target.closest&&e.target.closest('[data-open-contact]');if(x&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openContactDrawer(x.dataset.openContact);}},true);
'''
          rep('function acc(id,title,open,body,meta=\'\',icon=\'\'){', extra_js + '\nfunction acc(id,title,open,body,meta=\'\',icon=\'\'){', 'inject contact and analytics JS')

          rep(
              "const rows=[['Имя','Роль','Направления','Локация','Источник','Статус','Подтверждённость','Вакансии']];PROFILES.forEach(p=>rows.push([p.name,p.headline,p.directions.map(dirName).join('; '),p.location,p.source,STATE_LABEL[p.state],p.verify,candsForProfile(p.id).map(c=>vacById(c.vacancyId).title+' ('+STAGE_LABEL[c.stage]+')').join('; ')]));",
              "const rows=[['Имя','Роль','Направления','Локация','Источник','Статус профиля','Статус контакта','Подтверждённость','Вакансии']];PROFILES.forEach(p=>rows.push([p.name,p.headline,p.directions.map(dirName).join('; '),p.location,p.source,STATE_LABEL[p.state],csById(p.contactStatus||'none').l,p.verify,candsForProfile(p.id).map(c=>vacById(c.vacancyId).title+' ('+STAGE_LABEL[c.stage]+')').join('; ')]));",

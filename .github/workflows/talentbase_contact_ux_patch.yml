      - name: Static validation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('talentbase/index.html').read_text(encoding='utf-8')
          required=['CONTACT_STATUSES','page-analytics','contactDrawer','renderAnalytics','data-open-contact','Очередь контакта','В базе','На паузе']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing expected markers: '+', '.join(missing))
          if s.count('<html') != 1 or s.count('</html>') != 1 or s.count('<script>') < 2 or s.count('</script>') < 2:
              raise SystemExit('HTML shell/script structure check failed')
          print('Static markers OK; bytes:', len(s.encode('utf-8')))
          PY

      - name: Commit patched preview
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add talentbase/index.html .github/workflows/talentbase_contact_ux_patch.yml
          git commit -m "Improve TalentBase contact status and analytics UX"
          git push origin HEAD:feature/talentbase-contact-status-analytics

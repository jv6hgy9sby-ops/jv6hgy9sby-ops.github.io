<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TalentBase — Personal HR Workspace</title>
<style>
html,body{margin:0;min-height:100%;background:#111214;color:#e8eaec;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
#boot{padding:24px;font-size:14px;color:#a0a7ae}
</style>
</head>
<body>
<div id="boot">TalentBase загружается…</div>
<script>
(async()=>{
  try{
    const response=await fetch('./base-v1.html',{cache:'no-store'});
    if(!response.ok) throw new Error('HTTP '+response.status);
    let source=await response.text();
    source=source.replace('</head>','<link rel="stylesheet" href="./contact-analytics-v2.css"><link rel="stylesheet" href="./recruiting-core-v1.css?v=recruiting-core-v1"></head>');
    source=source.replace('</body>','<script src="./contact-analytics-v2.js"><\/script><script src="./recruiting-core-v1.js?v=recruiting-core-v1"><\/script><script src="./mobile-profile-hotfix-v3.js"><\/script></body>');
    document.open();
    document.write(source);
    document.close();
  }catch(error){
    console.error('TalentBase preview boot failed',error);
    const boot=document.getElementById('boot');
    if(boot) boot.textContent='Не удалось загрузить TalentBase preview';
  }
})();
</script>
</body>
</html>
